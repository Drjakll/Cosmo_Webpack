<!DOCTYPE html>
<html>
    <head>
        <title>Cosmo</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script>

            function Go_Back() {

                location = "/";

            }

        </script>

        <style>

            body {
                width: 100vw;
                height: 100vh;
                margin: 0;
                background-color: rgba(50,50,50,0.5);
            }

            #back-button {
                width: 100%;
                height: 50px;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: rgba(50,50,50,1);
                color: white;
                font-size: 20px;
                transition: 0.5s;
                user-select: none;
                box-shadow: 0px 5px 10px rgba(50,50,50,0.75);
            }

            #back-button:hover {
                cursor: pointer;
                background-color: rgba(50,50,50,0.75);
            }

            #video-demo-wrapper {
                width: 100%;
                height: calc(100% - 50px);
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #iframe-demo {
                box-shadow: -5px 5px 10px rgba(50,50,50,0.75);
                border-radius: 15px;
            }

            @media only screen and (max-width: 1000px){

                #iframe-demo {
                    width: 95%;
                    height: 50%;
                }
            }
        </style>

    </head>
    <body>
        
        <div id="back-button" onclick="Go_Back()">Back</div>

        <div id="video-demo-wrapper">

            <iframe
                id="iframe-demo"
                width="1000" 
                height="750" 
                src="https://www.youtube.com/embed/2Wn0i40mJPk?si=xRNZ29r2WMVYWszC" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; 
                        autoplay; 
                        clipboard-write; 
                        encrypted-media; 
                        gyroscope; 
                        picture-in-picture; 
                        web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>

        </div>
    </body>
</html>
